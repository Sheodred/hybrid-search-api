<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hybrid Search API</title>
<style>
  :root {
    --accent: #2563eb;
    --text: #1e293b;
    --muted: #64748b;
    --border: #cbd5e1;
    --bg: #f8fafc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 3rem 1.5rem;
    background: linear-gradient(180deg, #eef2ff 0%, var(--bg) 320px);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main {
    max-width: 680px;
    margin: 0 auto;
  }
  header {
    margin-bottom: 2rem;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 0.25rem;
    background: linear-gradient(90deg, var(--text), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline {
    color: var(--muted);
    font-size: 0.8rem;
    margin: 0;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.06);
  }
  input[type="text"] {
    font-size: 1rem;
    padding: 0.6rem 0.75rem;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    width: 100%;
    background: var(--bg);
    transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .options {
    display: flex;
    align-items: center;
    gap: 1rem;
    font-size: 0.8rem;
    color: var(--muted);
  }
  label.checkbox {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    cursor: pointer;
  }
  .lang-toggle {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .lang-toggle button {
    border: none;
    background: #fff;
    color: var(--muted);
    padding: 0.3rem 0.6rem;
    font-size: inherit;
    cursor: pointer;
  }
  .lang-toggle button.active {
    background: var(--accent);
    color: #fff;
  }
  .dataset-toggle {
    display: flex;
    gap: 0.5rem;
  }
  .dataset-toggle button {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    padding: 0.5rem 0.75rem;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .dataset-toggle button:hover {
    border-color: var(--accent);
  }
  .dataset-toggle button.active {
    border-color: var(--accent);
    background: #eff6ff;
    color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  }
  #dataset-description {
    margin: 0;
    color: var(--muted);
    font-size: 0.8rem;
    line-height: 1.4;
  }
  button[type="submit"] {
    align-self: flex-start;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.6rem 1.25rem;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.15);
    transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
  }
  button[type="submit"]:hover:not(:disabled) {
    background: #1d4ed8;
    transform: translateY(-1px);
    box-shadow: 0 4px 8px rgba(15, 23, 42, 0.2);
  }
  button[type="submit"]:disabled {
    opacity: 0.6;
    cursor: default;
    box-shadow: none;
  }
  #status {
    margin-top: 1rem;
    color: var(--muted);
    font-size: 0.8rem;
  }
  #status.error {
    color: #b91c1c;
  }
  #results {
    margin-top: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .answer-card {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 12px;
    padding: 1rem 1.25rem;
  }
  .answer-card h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent);
    margin: 0 0 0.5rem;
  }
  .answer-card p {
    margin: 0;
    line-height: 1.5;
  }
  .hit {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    transition: box-shadow 0.15s ease, transform 0.1s ease;
  }
  .hit:hover {
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    transform: translateY(-1px);
  }
  .hit h3 {
    margin: 0 0 0.35rem;
    font-size: 1rem;
    font-weight: 600;
  }
  .hit .score {
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: normal;
  }
  .hit p {
    margin: 0;
    color: var(--text);
    line-height: 1.45;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Hybrid Search API</h1>
    <p class="tagline" id="tagline">Elasticsearch hybrid search (BM25 + kNN) with an LLM RAG answer.</p>
  </header>

  <form id="search-form">
    <div class="dataset-toggle" role="group" aria-label="Dataset">
      <button type="button" id="dataset-demo" class="active"></button>
      <button type="button" id="dataset-nfcorpus"></button>
    </div>
    <p id="dataset-description"></p>
    <input type="text" id="query" name="query" required minlength="1" placeholder="Search…" autofocus />
    <div class="row">
      <div class="options">
        <label class="checkbox">
          <input type="checkbox" id="use-llm-answer" checked />
          <span id="answer-label">Generate answer</span>
        </label>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" id="lang-en" class="active">EN</button>
          <button type="button" id="lang-de">DE</button>
        </div>
      </div>
      <button type="submit" id="search-button">Search</button>
    </div>
  </form>

  <div id="status"></div>
  <div id="results"></div>
</main>

<script>
  const STRINGS = {
    en: {
      tagline: "Elasticsearch hybrid search (BM25 + kNN) with an LLM RAG answer.",
      placeholder: "Search…",
      answerLabel: "Generate answer",
      searchButton: "Search",
      searching: "Searching…",
      noResults: "No results.",
      answerHeading: "Answer",
      errorPrefix: "Something went wrong: ",
    },
    de: {
      tagline: "Elasticsearch Hybrid-Suche (BM25 + kNN) mit LLM-RAG-Antwort.",
      placeholder: "Suchen…",
      answerLabel: "Antwort generieren",
      searchButton: "Suchen",
      searching: "Suche läuft…",
      noResults: "Keine Ergebnisse.",
      answerHeading: "Antwort",
      errorPrefix: "Etwas ist schiefgelaufen: ",
    },
  };

  // Two indexed corpora to search against. "nfcorpus" only has results if
  // scripts/seed_nfcorpus.py has been run - see README.
  const DATASETS = {
    demo: {
      en: {
        label: "Demo (10 docs)",
        description:
          "10 curated documents about this project's own search/RAG concepts (BM25, RRF, embeddings, …) — a clean, self-referential demo set.",
        exampleQuery: "How does the RRF fusion algorithm combine BM25 and kNN results?",
      },
      de: {
        label: "Demo (10 Dokumente)",
        description:
          "10 kuratierte Dokumente über die Search-/RAG-Konzepte dieses Projekts selbst (BM25, RRF, Embeddings, …) – ein sauberes, selbstreferenzielles Demo-Set.",
        exampleQuery: "Wie kombiniert der RRF-Fusionsalgorithmus BM25- und kNN-Ergebnisse?",
      },
    },
    nfcorpus: {
      en: {
        label: "NFCorpus (~3.6K docs)",
        description:
          "~3,600 medical documents from NFCorpus (a recognized BEIR IR benchmark) — topically unrelated content at realistic scale, not just the self-referential demo set.",
        exampleQuery: "What are the effects of statin therapy on cardiovascular risk?",
      },
      de: {
        label: "NFCorpus (~3.600 Dokumente)",
        description:
          "~3.600 medizinische Dokumente aus NFCorpus (ein anerkannter BEIR-IR-Benchmark) – thematisch fremder Inhalt in realistischem Umfang, nicht nur das selbstreferenzielle Demo-Set.",
        exampleQuery: "Welche Auswirkungen hat eine Statintherapie auf das kardiovaskuläre Risiko?",
      },
    },
  };

  let lang = "en";
  let dataset = "demo";

  const form = document.getElementById("search-form");
  const queryInput = document.getElementById("query");
  const useLlmAnswerInput = document.getElementById("use-llm-answer");
  const searchButton = document.getElementById("search-button");
  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");
  const langButtons = { en: document.getElementById("lang-en"), de: document.getElementById("lang-de") };
  const datasetDescriptionEl = document.getElementById("dataset-description");
  const datasetButtons = {
    demo: document.getElementById("dataset-demo"),
    nfcorpus: document.getElementById("dataset-nfcorpus"),
  };

  // Prefills the query field with a ready-to-submit example instead of
  // leaving it empty - but only while it still holds a previous example,
  // never overwriting something the user actually typed.
  function applyExampleQuery(previousExamples) {
    const current = queryInput.value.trim();
    if (current === "" || previousExamples.includes(current)) {
      queryInput.value = DATASETS[dataset][lang].exampleQuery;
    }
  }

  function allExampleQueries() {
    return Object.values(DATASETS).flatMap((d) => Object.values(d).map((s) => s.exampleQuery));
  }

  function applyLanguage() {
    const s = STRINGS[lang];
    document.getElementById("tagline").textContent = s.tagline;
    document.getElementById("answer-label").textContent = s.answerLabel;
    queryInput.placeholder = s.placeholder;
    searchButton.textContent = s.searchButton;
    langButtons.en.classList.toggle("active", lang === "en");
    langButtons.de.classList.toggle("active", lang === "de");
    applyDataset();
  }

  function applyDataset() {
    const previousExamples = allExampleQueries();
    for (const key of Object.keys(DATASETS)) {
      datasetButtons[key].textContent = DATASETS[key][lang].label;
      datasetButtons[key].classList.toggle("active", key === dataset);
    }
    datasetDescriptionEl.textContent = DATASETS[dataset][lang].description;
    applyExampleQuery(previousExamples);
  }

  langButtons.en.addEventListener("click", () => { lang = "en"; applyLanguage(); });
  langButtons.de.addEventListener("click", () => { lang = "de"; applyLanguage(); });
  datasetButtons.demo.addEventListener("click", () => { dataset = "demo"; applyDataset(); });
  datasetButtons.nfcorpus.addEventListener("click", () => { dataset = "nfcorpus"; applyDataset(); });

  function renderResults(data) {
    resultsEl.innerHTML = "";

    if (data.answer) {
      const card = document.createElement("div");
      card.className = "answer-card";
      card.innerHTML = `<h2>${STRINGS[lang].answerHeading}</h2><p></p>`;
      card.querySelector("p").textContent = data.answer;
      resultsEl.appendChild(card);
    }

    if (data.hits.length === 0) {
      const empty = document.createElement("p");
      empty.textContent = STRINGS[lang].noResults;
      resultsEl.appendChild(empty);
      return;
    }

    for (const hit of data.hits) {
      const el = document.createElement("div");
      el.className = "hit";
      // 3 significant figures, not fixed decimals: RRF-fused scores are small
      // (~0.01-0.03) and toFixed(2) collapsed them into visual ties; raw BM25
      // scores are much larger and don't need 2 decimals at all.
      const score = Number(hit.score.toPrecision(3));
      el.innerHTML = `<h3>${escapeHtml(hit.title)} <span class="score">${score}</span></h3><p></p>`;
      el.querySelector("p").textContent = hit.content;
      resultsEl.appendChild(el);
    }
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const query = queryInput.value.trim();
    if (!query) return;

    searchButton.disabled = true;
    statusEl.textContent = STRINGS[lang].searching;
    statusEl.classList.remove("error");
    resultsEl.innerHTML = "";

    try {
      const response = await fetch("/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          query,
          use_llm_answer: useLlmAnswerInput.checked,
          lang,
          dataset,
        }),
      });
      const data = await response.json();

      if (!response.ok) {
        const detail = typeof data.detail === "string" ? data.detail : response.statusText;
        throw new Error(detail);
      }

      statusEl.textContent = "";
      renderResults(data);
    } catch (err) {
      statusEl.textContent = STRINGS[lang].errorPrefix + err.message;
      statusEl.classList.add("error");
    } finally {
      searchButton.disabled = false;
    }
  });

  applyLanguage();
</script>
</body>
</html>
