[project]
name = "hybrid-search-api"
version = "0.1.0"
description = "AI-powered hybrid search API: Elasticsearch (BM25 + kNN) combined with an LLM layer for query understanding and RAG-style answers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "elasticsearch>=8.13,<9",
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.3",
    "sentence-transformers>=3.0",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-mock>=3.14",
    "httpx>=0.27",   # used directly in tests to build fake openai.* exception responses
    "httpx2",        # FastAPI's TestClient (via Starlette) now prefers this over plain httpx
    "ruff>=0.5",
    "pre-commit>=3.7",
    "certifi",       # explicit CA bundle for scripts/seed_nfcorpus.py's dataset download
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends(...) in argument defaults is the documented, required pattern -
# not the bug flake8-bugbear's B008 is meant to catch.
"src/hybrid_search_api/api/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hybrid_search_api = ["static/*"]
